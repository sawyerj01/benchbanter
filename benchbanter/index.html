<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BenchBanter - Live Game Tracking & Odds</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --success-color: #16a34a;
            --danger-color: #dc2626;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --gold: #d97706;
            --input-bg: #f1f5f9;
            --fanduel-blue: #1493ff;
            --bet365-green: #007a53;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }

        header { background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--accent-color); }

        .dashboard { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; padding: 1.5rem; max-width: 1400px; margin: 0 auto; width: 100%; }
        @media (max-width: 900px) { .dashboard { grid-template-columns: 1fr; } }

        .filter-bar { display: flex; gap: 1rem; margin-bottom: 1rem; }
        .filter-control { background-color: var(--card-bg); border: 1px solid var(--border-color); padding: 0.5rem 0.75rem; border-radius: 8px; font-weight: 600; outline: none; }

        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem; }

        /* Status & Badges */
        .card-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .sport-badge { padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; background-color: #111827; color: #fff; }
        .game-status-pill { font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: 20px; }
        .status-upcoming { background-color: #e0f2fe; color: #0369a1; }
        .status-live { background-color: #fef2f2; color: var(--danger-color); animation: pulse 1.5s infinite; }
        .status-completed { background-color: #f1f5f9; color: var(--text-muted); }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Matchup Section with Logos & Scores */
        .matchup-container { display: flex; justify-content: space-between; align-items: center; margin: 1rem 0; }
        .team-box { display: flex; flex-direction: column; align-items: center; flex: 1; text-align: center; gap: 0.3rem; }
        .team-logo { width: 50px; height: 50px; object-fit: contain; background: #f8fafc; border-radius: 50%; padding: 4px; border: 1px solid var(--border-color); }
        .team-name { font-size: 1rem; font-weight: 700; }
        .team-record { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }

        .score-box { text-align: center; padding: 0 1rem; }
        .live-score { font-size: 1.8rem; font-weight: 900; color: var(--text-main); letter-spacing: 2px; }
        .vs-text { font-size: 0.85rem; color: var(--text-muted); font-weight: 700; }

        .prediction-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 1rem; }
        .pick-option { display: flex; flex-direction: column; gap: 0.35rem; }

        .pick-btn { background-color: var(--input-bg); border: 1px solid var(--border-color); padding: 0.6rem; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; }
        .pick-btn:hover:not(:disabled), .pick-btn.selected { border-color: var(--accent-color); background-color: #eff6ff; color: var(--accent-color); }
        .pick-btn:disabled { opacity: 0.5; cursor: not-allowed; background-color: #e2e8f0; }

        .odds-container { display: flex; justify-content: space-around; background-color: var(--input-bg); border-radius: 6px; padding: 0.3rem; font-size: 0.72rem; border: 1px solid var(--border-color); }
        .odds-item { font-weight: 600; }
        .brand-fanduel { color: var(--fanduel-blue); font-weight: 700; }
        .brand-bet365 { color: var(--bet365-green); font-weight: 700; }

        .submit-btn { grid-column: span 2; background-color: var(--accent-color); color: #fff; border: none; padding: 0.75rem; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .submit-btn:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .submit-btn.locked { background-color: var(--success-color); }

        .sidebar { display: flex; flex-direction: column; gap: 1rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🏒 BenchBanter</div>
    </header>

    <div class="dashboard">
        <main>
            <div class="filter-bar">
                <select id="sportSelect" class="filter-control">
                    <option value="icehockey_nhl">🏒 NHL</option>
                    <option value="baseball_mlb">⚾ MLB</option>
                    <option value="basketball_nba">🏀 NBA</option>
                    <option value="americanfootball_nfl">🏈 NFL</option>
                    <option value="mma_mixed_martial_arts">🥊 UFC</option>
                </select>
                <input type="date" id="dateSelect" class="filter-control">
            </div>

            <div id="matchesFeed"></div>
        </main>

        <aside class="sidebar">
            <div class="card">
                <h3>Leaderboard</h3>
                <p style="font-size:0.85rem; color:var(--text-muted); margin-top:0.5rem;">Locks 1 minute before game start!</p>
            </div>
        </aside>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sportSelect = document.getElementById('sportSelect');
            const dateSelect = document.getElementById('dateSelect');
            const matchesFeed = document.getElementById('matchesFeed');

            const todayEst = new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });
            dateSelect.value = todayEst;

            // Generate clean team logo URLs automatically
            function getTeamLogo(teamName) {
                const cleanName = teamName.toLowerCase().replace(/[^a-z0-0]/g, '');
                return `https://a.espncdn.com/combiner/i?img=/i/teamlogos/nhl/500/scoreboard/${cleanName}.png&h=80&w=80`;
            }

            async function fetchLiveOddsAndScores() {
                const sport = sportSelect.value;
                const date = dateSelect.value;
                matchesFeed.innerHTML = '<p style="color:var(--text-muted);">Fetching games & live tracking...</p>';

                try {
                    const response = await fetch(`/.netlify/functions/get-odds?sport=${sport}&date=${date}`);
                    const games = await response.json();

                    matchesFeed.innerHTML = '';

                    if (!Array.isArray(games) || games.length === 0) {
                        matchesFeed.innerHTML = '<p style="padding:1rem; color:var(--text-muted);">No games scheduled on this date.</p>';
                        return;
                    }

                    const now = new Date();

                    games.forEach(game => {
                        const gameStart = new Date(game.commence_time);
                        const isPastStartTime = now >= gameStart;
                        const isCompleted = game.completed === true;
                        const isLive = isPastStartTime && !isCompleted;

                        // Lock Window Rule: Disallow pick selection if game has started
                        const isLocked = isPastStartTime || isCompleted;

                        // Scores Extraction
                        let homeScore = 0;
                        let awayScore = 0;
                        if (game.scores) {
                            const hScoreObj = game.scores.find(s => s.name === game.home_team);
                            const aScoreObj = game.scores.find(s => s.name === game.away_team);
                            if (hScoreObj) homeScore = hScoreObj.score;
                            if (aScoreObj) awayScore = aScoreObj.score;
                        }

                        // Status Badge text
                        let statusHTML = '';
                        if (isCompleted) {
                            statusHTML = `<span class="game-status-pill status-completed">FINAL</span>`;
                        } else if (isLive) {
                            statusHTML = `<span class="game-status-pill status-live">🔴 LIVE (${homeScore} - ${awayScore})</span>`;
                        } else {
                            const estTime = gameStart.toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: '2-digit', minute: '2-digit' });
                            statusHTML = `<span class="game-status-pill status-upcoming">Starts ${estTime} EST</span>`;
                        }

                        const card = document.createElement('div');
                        card.className = 'card';

                        card.innerHTML = `
                            <div class="card-header-bar">
                                <span class="sport-badge">${game.sport_title || 'GAME'}</span>
                                ${statusHTML}
                            </div>

                            <div class="matchup-container">
                                <div class="team-box">
                                    <img class="team-logo" src="${getTeamLogo(game.home_team)}" onerror="this.src='https://via.placeholder.com/50?text=TEAM'" alt="${game.home_team}">
                                    <div class="team-name">${game.home_team}</div>
                                    <div class="team-record">Home</div>
                                </div>

                                <div class="score-box">
                                    ${isPastStartTime ? `<div class="live-score">${homeScore} - ${awayScore}</div>` : `<div class="vs-text">VS</div>`}
                                </div>

                                <div class="team-box">
                                    <img class="team-logo" src="${getTeamLogo(game.away_team)}" onerror="this.src='https://via.placeholder.com/50?text=TEAM'" alt="${game.away_team}">
                                    <div class="team-name">${game.away_team}</div>
                                    <div class="team-record">Away</div>
                                </div>
                            </div>

                            <div class="prediction-controls">
                                <div class="pick-option">
                                    <button class="pick-btn" data-choice="a" ${isLocked ? 'disabled' : ''}>
                                        ${game.home_team} ${isLocked ? '(Locked)' : 'Win'}
                                    </button>
                                </div>
                                <div class="pick-option">
                                    <button class="pick-btn" data-choice="b" ${isLocked ? 'disabled' : ''}>
                                        ${game.away_team} ${isLocked ? '(Locked)' : 'Win'}
                                    </button>
                                </div>
                                <button class="submit-btn" ${isLocked ? 'disabled' : ''}>
                                    ${isLocked ? '🔒 Picks Closed (Game Started)' : 'Lock In Prediction'}
                                </button>
                            </div>
                        `;

                        matchesFeed.appendChild(card);
                        setupInteractions(card, isLocked);
                    });

                } catch (err) {
                    matchesFeed.innerHTML = '<p>Error loading live sports data.</p>';
                }
            }

            function setupInteractions(card, isLocked) {
                if (isLocked) return;

                const pickBtns = card.querySelectorAll('.pick-btn');
                const submitBtn = card.querySelector('.submit-btn');
                let selectedChoice = null;

                pickBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        pickBtns.forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        selectedChoice = btn.dataset.choice;
                    });
                });

                submitBtn.addEventListener('click', () => {
                    if (!selectedChoice) { alert('Please select a pick!'); return; }
                    submitBtn.classList.add('locked');
                    submitBtn.textContent = '✓ Prediction Locked!';
                    pickBtns.forEach(b => b.disabled = true);
                });
            }

            sportSelect.addEventListener('change', fetchLiveOddsAndScores);
            dateSelect.addEventListener('change', fetchLiveOddsAndScores);

            fetchLiveOddsAndScores();
            // Auto refresh live scores every 60 seconds
            setInterval(fetchLiveOddsAndScores, 60000);
        });
    </script>
</body>
</html>
